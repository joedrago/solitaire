name: Solitaire
options:
    bundleIdPrefix: com.solitaire
    deploymentTarget:
        tvOS: "17.0"
targets:
    Solitaire:
        type: application
        platform: tvOS
        sources:
            - Sources
        settings:
            INFOPLIST_FILE: Sources/Info.plist
            DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
            PRODUCT_BUNDLE_IDENTIFIER: com.solitaire.app
            CODE_SIGN_STYLE: Automatic
            ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
